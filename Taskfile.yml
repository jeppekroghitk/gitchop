version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  harness:
    desc: Serve the harness over http and open it — the menu and the settings page
    cmds:
      - node dev/serve.mjs --open {{.CLI_ARGS}}

  test:
    desc: Run every test under node's test runner
    cmds:
      - npm test

  lint:
    desc: Lint the sources, the dev scripts and the tests with ESLint
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check the sources from their JSDoc — nothing is emitted
    cmds:
      - npm run typecheck

  build:
    desc: Package the extension for every browser, or one — `task build -- chrome --no-zip` for an unpacked one
    cmds:
      - node dev/build.mjs {{.CLI_ARGS | default "all"}}

  watch:
    desc: Build dist/<browser> unpacked and rebuild on every change — `task watch -- firefox` for one browser
    cmds:
      - node dev/build.mjs --watch {{.CLI_ARGS}}
