<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gitchop harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; font: 14px -apple-system, sans-serif; }
      #page { position: fixed; inset: 0; width: 100vw; height: 100vh; }
      #page img { display: block; width: 100vw; height: 100vh; }
      #tools {
        position: fixed; bottom: 12px; left: 12px; z-index: 10;
        display: flex; gap: 8px; align-items: center;
        font: 12px ui-monospace, monospace; color: #24292f;
        background: rgba(255,255,255,.9); border: 1px solid #d0d7de; padding: 8px 10px;
      }
      #tools input { width: 120px; }
      #fx {
        position: fixed; bottom: 12px; right: 12px; z-index: 10;
        display: grid; gap: 7px;
        font: 12px ui-monospace, monospace; color: #24292f;
        background: rgba(255,255,255,.9); border: 1px solid #d0d7de; padding: 10px 12px;
      }
      #fx b { font-weight: 600; letter-spacing: 0.04em; }
      #fx .fxrow { display: grid; grid-template-columns: 80px 158px 52px; gap: 8px; align-items: center; }
      #fx input[type="checkbox"] { justify-self: start; margin: 0; }
      #fx output { text-align: right; }
      #fx .chips { display: grid; grid-template-columns: repeat(9, 14px); gap: 4px; }
      #fx .chips button { width: 14px; height: 14px; padding: 0; border: 1px solid #d0d7de; cursor: pointer; }
      #fx .chips button[data-selected="true"] { outline: 2px solid #0969da; outline-offset: 1px; }
    </style>
  </head>
  <body>
    <div id="page"></div>
    <div id="tools">
      <span id="state">ready</span>
      <button id="chop">chop (or press .)</button>
      <input id="typehere" placeholder="typing here = no chop" />
    </div>
    <!-- The settings page needs a real extension context, so the Settings row cannot open it here;
         these sliders stand in for its Chop effect card, writing to the same (fake) store. -->
    <div id="fx">
      <b>chop effect</b>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const SLOW = Number(params.get('slow') || 1);
      const FREEZE = Number(params.get('freeze') || 0);

      if (SLOW !== 1 || FREEZE) {
        const native = Element.prototype.animate;
        Element.prototype.animate = function (keyframes, options) {
          const scaled = typeof options === 'number'
            ? options * SLOW
            : { ...options, duration: (options.duration ?? 0) * SLOW, delay: (options.delay ?? 0) * SLOW };
          const animation = native.call(this, keyframes, scaled);
          // ?freeze=200 pins every animation at that instant — a still of the chop mid-flight.
          if (FREEZE) {
            animation.pause();
            animation.currentTime = FREEZE;
          }
          return animation;
        };
      }

      function pageSvg(w, h) {
        const rows = [];
        for (let i = 0; i < 9; i++) {
          const y = 250 + i * 44;
          rows.push(`<rect x="60" y="${y}" width="${w - 120}" height="43" fill="${i % 2 ? '#f6f8fa' : '#ffffff'}"/>
            <rect x="80" y="${y + 15}" width="16" height="13" fill="#54aeff"/>
            <rect x="108" y="${y + 16}" width="${140 + ((i * 37) % 160)}" height="11" fill="#57606a"/>
            <rect x="${w - 320}" y="${y + 16}" width="${120 + ((i * 23) % 90)}" height="11" fill="#d0d7de"/>`);
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          <rect width="${w}" height="${h}" fill="#ffffff"/>
          <rect width="${w}" height="62" fill="#24292f"/>
          <circle cx="42" cy="31" r="13" fill="#ffffff"/>
          <rect x="76" y="24" width="150" height="14" rx="2" fill="#57606a"/>
          <rect x="${w - 260}" y="20" width="220" height="22" rx="3" fill="#3b4249"/>
          <rect x="60" y="96" width="330" height="22" fill="#0969da"/>
          <rect x="60" y="150" width="${w - 120}" height="1" fill="#d0d7de"/>
          <rect x="60" y="140" width="60" height="10" fill="#24292f"/>
          <rect x="150" y="140" width="70" height="10" fill="#8c959f"/>
          <rect x="250" y="140" width="80" height="10" fill="#8c959f"/>
          <rect x="60" y="190" width="${w - 120}" height="44" fill="#f6f8fa" stroke="#d0d7de"/>
          <rect x="80" y="205" width="180" height="13" fill="#57606a"/>
          ${rows.join('')}
        </svg>`;
      }

      function paintPage() {
        const svg = pageSvg(window.innerWidth, window.innerHeight);
        document.getElementById('page').innerHTML =
          `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" alt="">`;
      }
      paintPage();
      addEventListener('resize', paintPage);

      const store = {
        // Enough epicness to show the new effects off, blade classic; override any slider in the
        // URL, e.g. harness.html?colour=210&epicness=90&speed=50, ?menuDelay=0 for a menu that
        // rises the instant the blade lands, or ?enabled=0 for the instant open. Every slider
        // needs its key here, or the URL has nothing to override.
        effects: { enabled: 1, colour: 0, epicness: 60, speed: 100, menuDelay: 140 },
        links: [
          { id: '1', icon: '🔔', label: 'Notifications', url: 'https://github.com/notifications' },
          { id: '2', icon: '🧩', label: 'Your pull requests', url: 'https://github.com/pulls' },
          { id: '3', icon: '🐛', label: 'Issues assigned to you', url: 'https://github.com/issues/assigned' },
          { id: '4', icon: '⚙️', label: 'This repo: Actions', url: 'https://github.com/{repoFull}/actions' },
          { id: '5', icon: '🔀', label: 'This repo: Pull requests', url: 'https://github.com/{repoFull}/pulls' },
          { id: '6', icon: '🌿', label: 'This branch: Commits', url: 'https://github.com/{repoFull}/commits/{branch}' },
        ],
      };

      // The pull requests, as the background would answer them. ?pulls=off hides the column,
      // ?pulls=empty shows three quiet lanes, ?pulls=fail shows a token that cannot read pull
      // requests, and ?pulls=cached skips the skeletons and paints a fresh snapshot straight away.
      const LANES = [
        { id: 'reviewed', title: 'Feedback on your PRs', empty: 'no feedback on your PRs yet', slots: 3, all: 'https://github.com/pulls' },
        { id: 'needsReview', title: 'Waiting on you', empty: 'nothing waiting on you', slots: 3, all: 'https://github.com/pulls/review-requested' },
        { id: 'unreviewed', title: 'Waiting on others', empty: 'nothing waiting on others', slots: 2, all: 'https://github.com/pulls' },
      ];
      const pull = (repo, number, title, over = {}) => ({
        number, title, url: `https://github.com/${repo}/pull/${number}`, repo, repoShort: repo.split('/')[1],
        private: false, draft: false, author: '', verdict: null, age: '', ...over,
      });
      // Enough of them that the column overflows and has to scroll — that is the case worth
      // exercising here, since a column that fits never shows what the wheel does.
      const PULLS = {
        needsReview: [
          pull('os2display/display-api-service', 412, 'Fix feed source caching', { private: true, author: 'jekuno', age: '2h' }),
          pull('itk-dev/economics', 88, 'Quarterly export, with the long title that has to be cut off somewhere sensible', { private: true, author: 'tuj', age: '1d' }),
          pull('Leantime/leantime', 2201, 'Docker healthcheck', { author: 'marcel', age: '3d' }),
          pull('os2display/display-client', 640, 'Slide transitions respect reduced motion', { author: 'jekuno', age: '4d' }),
          pull('itk-dev/economics', 79, 'Import from the bank export', { private: true, author: 'tuj', age: '1w' }),
          pull('itk-dev/hoeringsportal', 302, 'Consent banner copy', { private: true, author: 'rimi', age: '1w' }),
          pull('os2display/display-templates', 155, 'Poster template: fall back to the venue image when the event has none', { author: 'sine', age: '2w' }),
          pull('itk-dev/economics', 71, 'Archive closed periods', { private: true, author: 'tuj', age: '3w' }),
        ],
        reviewed: [
          pull('itk-dev/gitchop', 17, 'Pull requests beside the menu', { verdict: 'approved', age: '40m' }),
          pull('itk-dev/economics', 84, 'Invoice numbering', { private: true, verdict: 'changes', age: '5h' }),
          pull('os2display/display-client', 633, 'Preload the next slide', { verdict: 'approved', age: '1d' }),
          pull('itk-dev/hoeringsportal', 298, 'Hearing deadline in the reply form', { private: true, verdict: 'changes', age: '2d' }),
          pull('itk-dev/gitchop', 14, 'Firefox 140 is the minimum', { verdict: 'approved', age: '6d' }),
        ],
        unreviewed: [
          pull('itk-dev/economics', 91, 'Rounding in VAT lines', { private: true, age: '5h' }),
          pull('itk-dev/gitchop', 19, 'Let the lists scroll under the wheel', { age: '1h' }),
          pull('os2display/display-api-service', 419, 'Feed source: honour the cache headers the upstream actually sends', { private: true, age: '3d' }),
          pull('itk-dev/hoeringsportal', 305, 'Draft: attachments on replies', { private: true, draft: true, age: '4d' }),
        ],
      };
      function pullsAnswer(message) {
        const mode = params.get('pulls') ?? 'on';
        if (mode === 'off') return { ok: true, show: false };
        const bare = LANES.map((lane) => ({ ...lane, pulls: null, total: null }));
        const filled = LANES.map((lane) => {
          const pulls = mode === 'empty' ? [] : PULLS[lane.id];
          return { ...lane, pulls, total: pulls.length };
        });
        if (message.type === 'gitchop:pulls') {
          if (mode === 'cached') return { ok: true, show: true, stale: false, fetchedAgo: '2m', error: null, lanes: filled };
          return { ok: true, show: true, stale: true, fetchedAgo: '', error: null, lanes: bare };
        }
        const fail = 'The token cannot read pull requests. A classic token needs repo; a fine-grained one needs Pull requests: read-only.';
        if (mode === 'fail') return { ok: true, show: true, stale: false, fetchedAgo: '', error: fail, lanes: bare };
        return { ok: true, show: true, stale: false, fetchedAgo: 'now', error: null, lanes: filled };
      }

      const storageListeners = [];
      window.browser = window.chrome = {
        runtime: {
          lastError: undefined,
          async sendMessage(message) {
            document.getElementById('state').textContent = `msg: ${message.type}`;
            if (message.type === 'gitchop:options') {
              document.getElementById('state').textContent = 'settings: the sliders, bottom right';
              document.getElementById('fx').animate(
                [{ boxShadow: '0 0 0 3px #0969da' }, { boxShadow: '0 0 0 3px rgba(9, 105, 218, 0)' }],
                { duration: 1400, easing: 'ease-out' },
              );
              return { ok: true };
            }
            if (message.type === 'gitchop:pulls') return pullsAnswer(message);
            if (message.type === 'gitchop:pulls:refresh') {
              await new Promise((done) => setTimeout(done, 900));
              return pullsAnswer(message);
            }
            if (message.type !== 'gitchop:repos') return { ok: true };
            await new Promise((done) => setTimeout(done, 260));
            if (params.get('search') === 'fail') return { ok: false, error: 'GitHub rate-limited the search.' };
            const term = message.query.split('/').pop();
            return {
              ok: true,
              owners: ['itk-dev', 'os2display'],
              results: [
                { fullName: `itk-dev/${term}`, url: 'https://github.com/itk-dev', description: 'the one you almost certainly meant', private: true, archived: false, owned: true },
                { fullName: `os2display/${term}-admin`, url: 'https://github.com/os2display', description: '', private: false, archived: false, owned: true },
                { fullName: `Leantime/${term}`, url: 'https://github.com/Leantime/leantime', description: 'open source project management', private: false, archived: false, owned: false },
                { fullName: `someone/${term}-old`, url: 'https://github.com/someone', description: 'no longer maintained', private: false, archived: true, owned: false },
              ],
            };
          },
        },
        storage: {
          sync: {
            get: async () => JSON.parse(JSON.stringify(store)),
            // Notifies like the real API, so the content script's effects cache follows the sliders.
            set: async (patch) => {
              const changes = {};
              for (const [key, value] of Object.entries(patch)) {
                changes[key] = { oldValue: store[key], newValue: value };
              }
              Object.assign(store, patch);
              for (const listener of storageListeners) listener(changes, 'sync');
            },
          },
          onChanged: { addListener: (listener) => storageListeners.push(listener) },
        },
      };

      for (const key of Object.keys(store.effects)) {
        if (params.has(key)) store.effects[key] = Number(params.get(key));
      }

      document.getElementById('chop').addEventListener('click', () => {
        dispatchEvent(new KeyboardEvent('keydown', { key: '.', bubbles: true }));
      });
    </script>
    <script src="../src/content/context.js"></script>
    <script src="../src/content/effects.js"></script>
    <script src="../src/content/styles.js"></script>
    <script src="../src/content/chop.js"></script>
    <script src="../src/content/menu.js"></script>
    <script src="../src/content/main.js"></script>
    <script>
      const fxRows = document.getElementById('fx');
      for (const spec of window.__gitchop.EFFECTS.SLIDERS) {
        // A <label> would forward every click to its first button, so swatch rows are plain divs.
        const row = document.createElement(spec.swatches ? 'div' : 'label');
        row.className = 'fxrow';
        row.title = spec.hint;
        const name = document.createElement('span');
        name.textContent = spec.label.toLowerCase();
        const value = document.createElement('output');

        if (spec.swatches) {
          const chips = document.createElement('div');
          chips.className = 'chips';
          const mark = () => {
            for (const chip of chips.children) {
              chip.dataset.selected = String(Number(chip.dataset.value) === store.effects[spec.id]);
            }
            const current = spec.swatches.find((swatch) => swatch.value === store.effects[spec.id]);
            value.textContent = current ? current.name : `${store.effects[spec.id]}°`;
          };
          for (const swatch of spec.swatches) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.title = swatch.name;
            chip.dataset.value = String(swatch.value);
            chip.style.background = swatch.value === 0 ? '#f2f5f8' : `hsl(${swatch.value} 75% 60%)`;
            chip.addEventListener('click', () => {
              browser.storage.sync.set({ effects: { ...store.effects, [spec.id]: swatch.value } }).then(mark);
            });
            chips.append(chip);
          }
          mark();
          row.append(name, chips, value);
        } else if (spec.toggle) {
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = (store.effects[spec.id] ?? spec.value) === 1;
          value.textContent = input.checked ? 'on' : 'off';
          input.addEventListener('change', () => {
            value.textContent = input.checked ? 'on' : 'off';
            browser.storage.sync.set({ effects: { ...store.effects, [spec.id]: input.checked ? 1 : 0 } });
          });
          row.append(name, input, value);
        } else {
          const input = document.createElement('input');
          input.type = 'range';
          input.min = String(spec.min);
          input.max = String(spec.max);
          input.step = '1';
          input.value = String(store.effects[spec.id] ?? spec.value);
          value.textContent = input.value;
          input.addEventListener('input', () => {
            value.textContent = input.value;
            browser.storage.sync.set({ effects: { ...store.effects, [spec.id]: Number(input.value) } });
          });
          row.append(name, input, value);
        }
        fxRows.append(row);
      }

      // harness.html?autochop&hue=210&tint=80 chops on load, so a reload replays the effect.
      if (params.has('autochop')) document.getElementById('chop').click();
    </script>
  </body>
</html>
