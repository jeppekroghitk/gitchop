<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gitchop harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; font: 14px -apple-system, sans-serif; }
      #page { position: fixed; inset: 0; width: 100vw; height: 100vh; }
      #page img { display: block; width: 100vw; height: 100vh; }
      #tools {
        position: fixed; bottom: 12px; left: 12px; z-index: 10;
        display: flex; gap: 8px; align-items: center;
        font: 12px ui-monospace, monospace; color: #24292f;
        background: rgba(255,255,255,.9); border: 1px solid #d0d7de; padding: 8px 10px;
      }
      #tools input { width: 120px; }
      #settings { position: fixed; inset: 0; z-index: 5; width: 100vw; height: 100vh; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div id="page"></div>
    <div id="tools">
      <span id="state">ready</span>
      <button id="chop">chop (or press .)</button>
      <input id="typehere" placeholder="typing here = no chop" />
      <button id="settings-toggle">settings</button>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const SLOW = Number(params.get('slow') || 1);
      const FREEZE = Number(params.get('freeze') || 0);

      // ?openshadow lets a script reach the menu — the real overlay closes its shadow root, and a
      // driver checking which column has the cursor needs a way in.
      if (params.has('openshadow')) {
        const nativeShadow = Element.prototype.attachShadow;
        Element.prototype.attachShadow = function (init) {
          return nativeShadow.call(this, { ...init, mode: 'open' });
        };
      }

      if (SLOW !== 1 || FREEZE) {
        const native = Element.prototype.animate;
        Element.prototype.animate = function (keyframes, options) {
          const scaled = typeof options === 'number'
            ? options * SLOW
            : { ...options, duration: (options.duration ?? 0) * SLOW, delay: (options.delay ?? 0) * SLOW };
          const animation = native.call(this, keyframes, scaled);
          // ?freeze=200 pins every animation at that instant — a still of the chop mid-flight.
          if (FREEZE) {
            animation.pause();
            animation.currentTime = FREEZE;
          }
          return animation;
        };
      }

      function pageSvg(w, h) {
        const rows = [];
        for (let i = 0; i < 9; i++) {
          const y = 250 + i * 44;
          rows.push(`<rect x="60" y="${y}" width="${w - 120}" height="43" fill="${i % 2 ? '#f6f8fa' : '#ffffff'}"/>
            <rect x="80" y="${y + 15}" width="16" height="13" fill="#54aeff"/>
            <rect x="108" y="${y + 16}" width="${140 + ((i * 37) % 160)}" height="11" fill="#57606a"/>
            <rect x="${w - 320}" y="${y + 16}" width="${120 + ((i * 23) % 90)}" height="11" fill="#d0d7de"/>`);
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          <rect width="${w}" height="${h}" fill="#ffffff"/>
          <rect width="${w}" height="62" fill="#24292f"/>
          <circle cx="42" cy="31" r="13" fill="#ffffff"/>
          <rect x="76" y="24" width="150" height="14" rx="2" fill="#57606a"/>
          <rect x="${w - 260}" y="20" width="220" height="22" rx="3" fill="#3b4249"/>
          <rect x="60" y="96" width="330" height="22" fill="#0969da"/>
          <rect x="60" y="150" width="${w - 120}" height="1" fill="#d0d7de"/>
          <rect x="60" y="140" width="60" height="10" fill="#24292f"/>
          <rect x="150" y="140" width="70" height="10" fill="#8c959f"/>
          <rect x="250" y="140" width="80" height="10" fill="#8c959f"/>
          <rect x="60" y="190" width="${w - 120}" height="44" fill="#f6f8fa" stroke="#d0d7de"/>
          <rect x="80" y="205" width="180" height="13" fill="#57606a"/>
          ${rows.join('')}
        </svg>`;
      }

      function paintPage() {
        const svg = pageSvg(window.innerWidth, window.innerHeight);
        document.getElementById('page').innerHTML =
          `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" alt="">`;
      }
      paintPage();
      addEventListener('resize', paintPage);

      const store = {
        // Enough epicness to show the new effects off, blade classic; override any slider in the
        // URL, e.g. harness.html?colour=210&epicness=90&speed=50, ?menuDelay=0 for a menu that
        // rises the instant the blade lands, or ?enabled=0 for the instant open. Every slider
        // needs its key here, or the URL has nothing to override.
        effects: { enabled: 1, colour: 0, epicness: 60, speed: 100, menuDelay: 140 },
        // ?panel=off leaves the menu without the links and the search: only the columns rise.
        panel: { enabled: params.get('panel') === 'off' ? 0 : 1 },
        links: [
          { id: '1', icon: '🔔', label: 'Notifications', url: 'https://github.com/notifications' },
          { id: '2', icon: '🧩', label: 'Your pull requests', url: 'https://github.com/pulls' },
          { id: '3', icon: '🐛', label: 'Issues assigned to you', url: 'https://github.com/issues/assigned' },
          { id: '4', icon: '⚙️', label: 'This repo: Actions', url: 'https://github.com/{repoFull}/actions' },
          { id: '5', icon: '🔀', label: 'This repo: Pull requests', url: 'https://github.com/{repoFull}/pulls' },
          { id: '6', icon: '🌿', label: 'This branch: Commits', url: 'https://github.com/{repoFull}/commits/{branch}' },
        ],
      };

      // What the settings page asks the background that the menu never does: the tokens, the backup,
      // the private index. ?token=none starts with nothing saved — every card then says what a token
      // would unlock — ?token=fine with three fine-grained tokens in their three states,
      // ?backup=on starts with the gist connected, ?index=empty with no index built and
      // ?index=public with one that found no private repositories.
      const now = () => new Date().toISOString();
      const wait = (ms) => new Promise((done) => setTimeout(done, ms));
      const daysFromNow = (days) => new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
      const backup = params.get('backup') === 'on';
      const sync = {
        // ?token=fine is the fine-grained picture: one that lists an organisation's private
        // repositories, one made for an organisation that has yet to approve it — named for the
        // owner from the recipe, since it lists nothing — and the account's own, run out.
        tokens:
          params.get('token') === 'none'
            ? []
            : params.get('token') === 'fine'
              ? [
                  { id: 't1', secret: 'github_pat_h1', login: 'jeppekrogh', kind: 'fine-grained', scopes: [], owners: ['itk-dev'], target: 'itk-dev', expiresAt: daysFromNow(200) },
                  { id: 't2', secret: 'github_pat_h2', login: 'jeppekrogh', kind: 'fine-grained', scopes: [], owners: [], target: 'os2display', expiresAt: daysFromNow(9) },
                  { id: 't3', secret: 'github_pat_h3', login: 'jeppekrogh', kind: 'fine-grained', scopes: [], owners: [], target: null, expiresAt: daysFromNow(-3) },
                ]
              : [{ id: 't1', secret: 'ghp_harness', login: 'jeppekrogh', kind: 'classic', scopes: ['repo', 'gist'], owners: ['jeppekrogh', 'itk-dev', 'os2display'], target: null, expiresAt: daysFromNow(300) }],
        gistId: backup ? 'c0ffee5eed1234567890abcdef' : null,
        lastPulledAt: backup ? '2026-09-17T06:00:00.000Z' : null,
        lastPushedAt: backup ? '2026-09-17T07:12:00.000Z' : null,
        dirty: false,
        lastError: null,
      };
      function syncState() {
        const hasToken = sync.tokens.length > 0;
        return {
          ok: true,
          tokens: sync.tokens.map(({ id, login, kind, scopes, owners, target, expiresAt }) => ({ id, login, kind, scopes, owners, target: target ?? null, expiresAt: expiresAt ?? null, broad: scopes.includes('repo') })),
          hasToken,
          connected: hasToken && Boolean(sync.gistId),
          gistId: sync.gistId,
          gistUrl: sync.gistId ? `https://gist.github.com/${sync.gistId}` : null,
          lastPulledAt: sync.lastPulledAt,
          lastPushedAt: sync.lastPushedAt,
          dirty: sync.dirty,
          lastError: sync.lastError,
        };
      }
      const NO_INDEX = { count: 0, privateCount: 0, owners: [], builtAt: null };
      const builtIndex = (at) => ({
        count: 212,
        privateCount: params.get('index') === 'public' ? 0 : 143,
        owners: [{ owner: 'itk-dev', count: 168 }, { owner: 'os2display', count: 31 }, { owner: 'jeppekrogh', count: 13 }],
        builtAt: at,
      });
      let index = params.get('index') === 'empty' || sync.tokens.length === 0 ? NO_INDEX : builtIndex('2026-09-16T08:02:11.000Z');
      const indexState = () => ({ ok: true, ...index, failures: [] });
      async function settingsAnswer(message) {
        switch (message.type) {
          case 'gitchop:sync:state':
            return syncState();
          case 'gitchop:token:save': {
            await wait(600);
            const secret = String(message.token ?? '').trim();
            if (!secret) return { ok: false, error: 'A token is required.' };
            if (sync.tokens.some((entry) => entry.secret === secret)) return { ok: false, error: 'That token is already saved.' };
            // Labelled the way GitHub would label it; anything else is saved unlabelled, as the background does.
            // A fine-grained token reaches one owner; the first one added is an organisation's, the next a
            // pending one that lists nothing yet.
            const fine = secret.startsWith('github_pat_');
            const classic = secret.startsWith('ghp_');
            const fineBefore = sync.tokens.filter((entry) => entry.kind === 'fine-grained').length;
            sync.tokens.push({
              id: crypto.randomUUID(),
              secret,
              login: fine || classic ? 'someone' : null,
              kind: fine ? 'fine-grained' : classic ? 'classic' : null,
              scopes: classic ? ['repo'] : [],
              owners: fine ? (fineBefore === 0 ? ['itk-dev'] : []) : classic ? ['someone', 'itk-dev'] : null,
              // The owner named in the recipe, and an expiry a year out — as the background reads them.
              target: String(message.owner ?? '').trim() || null,
              expiresAt: fine || classic ? '2027-09-17T12:00:00.000Z' : null,
            });
            return syncState();
          }
          case 'gitchop:token:remove':
            sync.tokens = sync.tokens.filter((entry) => entry.id !== message.id);
            // Nothing left to reach GitHub with: the backup, the index and the snapshots go with it.
            if (sync.tokens.length === 0) {
              Object.assign(sync, { gistId: null, dirty: false });
              index = NO_INDEX;
              pullsFilled = false;
              newsFilled = false;
              contribTotal = null;
              contribFetchedAt = null;
              contribFresh = false;
            }
            return syncState();
          case 'gitchop:sync:connect':
            if (sync.tokens.length === 0) return { ok: false, error: 'Add a token first.' };
            await wait(700);
            Object.assign(sync, {
              gistId: String(message.gistId ?? '').trim() || 'c0ffee5eed1234567890abcdef',
              lastPulledAt: now(),
              lastPushedAt: now(),
              dirty: false,
              lastError: null,
            });
            return syncState();
          case 'gitchop:sync:stop':
            Object.assign(sync, { gistId: null, dirty: false, lastError: null });
            return syncState();
          case 'gitchop:sync:pull':
            await wait(600);
            Object.assign(sync, { lastPulledAt: now(), dirty: false });
            return { ...syncState(), changed: true };
          case 'gitchop:sync:push':
            await wait(600);
            Object.assign(sync, { lastPushedAt: now(), dirty: false });
            return { ...syncState(), changed: true };
          case 'gitchop:index:state':
            return indexState();
          case 'gitchop:index:build':
            if (sync.tokens.length === 0) return { ok: false, error: 'Add a token first.' };
            await wait(1200);
            index = builtIndex(now());
            return indexState();
          case 'gitchop:index:clear':
            index = NO_INDEX;
            return indexState();
          default:
            return null;
        }
      }

      // The pull requests, as the background would answer them. ?pulls=off starts with the switch
      // off, ?pulls=empty shows three quiet lanes, ?pulls=fail shows a token that cannot read pull
      // requests, and ?pulls=cached skips the skeletons and paints a snapshot straight away. Every
      // open after the first finds one more of Waiting on you reviewed since — as a morning of
      // reviewing would — so chop, Esc, chop is a row leaving the column each time, until the lane
      // is empty and its quiet line stands.
      const LANES = [
        { id: 'reviewed', title: 'Feedback on your PRs', empty: 'no feedback on your PRs yet', slots: 3, all: 'https://github.com/pulls' },
        { id: 'needsReview', title: 'Waiting on you', empty: 'nothing waiting on you', slots: 3, all: 'https://github.com/pulls/review-requested' },
        { id: 'unreviewed', title: 'Waiting on others', empty: 'nothing waiting on others', slots: 2, all: 'https://github.com/pulls' },
      ];
      const pull = (repo, number, title, over = {}) => ({
        number, title, url: `https://github.com/${repo}/pull/${number}`, repo, repoShort: repo.split('/')[1],
        private: false, draft: false, author: '', verdict: null, age: '', ...over,
      });
      // Enough of them that the column overflows and has to scroll — that is the case worth
      // exercising here, since a column that fits never shows what the wheel does.
      const PULLS = {
        needsReview: [
          pull('os2display/display-api-service', 412, 'Fix feed source caching', { private: true, author: 'jekuno', age: '2h' }),
          pull('itk-dev/economics', 88, 'Quarterly export, with the long title that has to be cut off somewhere sensible', { private: true, author: 'tuj', age: '1d' }),
          pull('Leantime/leantime', 2201, 'Docker healthcheck', { author: 'marcel', age: '3d' }),
          pull('os2display/display-client', 640, 'Slide transitions respect reduced motion', { author: 'jekuno', age: '4d' }),
          pull('itk-dev/economics', 79, 'Import from the bank export', { private: true, author: 'tuj', age: '1w' }),
          pull('itk-dev/hoeringsportal', 302, 'Consent banner copy', { private: true, author: 'rimi', age: '1w' }),
          pull('os2display/display-templates', 155, 'Poster template: fall back to the venue image when the event has none', { author: 'sine', age: '2w' }),
          pull('itk-dev/economics', 71, 'Archive closed periods', { private: true, author: 'tuj', age: '3w' }),
        ],
        reviewed: [
          pull('itk-dev/gitchop', 17, 'Pull requests beside the menu', { verdict: 'approved', age: '40m' }),
          pull('itk-dev/economics', 84, 'Invoice numbering', { private: true, verdict: 'changes', age: '5h' }),
          pull('os2display/display-client', 633, 'Preload the next slide', { verdict: 'approved', age: '1d' }),
          pull('itk-dev/hoeringsportal', 298, 'Hearing deadline in the reply form', { private: true, verdict: 'changes', age: '2d' }),
          pull('itk-dev/gitchop', 14, 'Firefox 140 is the minimum', { verdict: 'approved', age: '6d' }),
        ],
        unreviewed: [
          pull('itk-dev/economics', 91, 'Rounding in VAT lines', { private: true, age: '5h' }),
          pull('itk-dev/gitchop', 19, 'Let the lists scroll under the wheel', { age: '1h' }),
          pull('os2display/display-api-service', 419, 'Feed source: honour the cache headers the upstream actually sends', { private: true, age: '3d' }),
          pull('itk-dev/hoeringsportal', 305, 'Draft: attachments on replies', { private: true, draft: true, age: '4d' }),
        ],
      };
      const pullsMode = params.get('pulls') ?? 'on';
      const pullsSettings = { enabled: pullsMode === 'off' ? 0 : 1, badge: 1, drafts: 0 };
      let pullsReviewed = 0;
      let pullsFilled = pullsMode === 'cached';
      let pullsFetchedAt = pullsFilled ? '2026-09-17T07:10:00.000Z' : null;
      function pullsAnswer(message) {
        const mode = pullsMode;
        const hasToken = sync.tokens.length > 0;
        const head = { ok: true, settings: { ...pullsSettings }, hasToken, show: hasToken && pullsSettings.enabled === 1, partial: null };
        if (!head.show) return head;
        const bare = LANES.map((lane) => ({ ...lane, pulls: null, total: null }));
        const filled = () =>
          LANES.map((lane) => {
            let pulls = mode === 'empty' ? [] : PULLS[lane.id];
            if (lane.id === 'needsReview') pulls = pulls.slice(pullsReviewed);
            return { ...lane, pulls, total: pulls.length };
          });
        if (message.type === 'gitchop:pulls:refresh') {
          const fail = 'The token cannot read pull requests. A classic token needs repo; a fine-grained one needs Pull requests: read-only.';
          if (mode === 'fail') return { ...head, stale: false, fetchedAt: null, fetchedAgo: '', error: fail, lanes: bare };
          if (pullsFilled) pullsReviewed = Math.min(PULLS.needsReview.length, pullsReviewed + 1);
          pullsFilled = true;
          pullsFetchedAt = now();
          return { ...head, stale: false, fetchedAt: pullsFetchedAt, fetchedAgo: 'now', error: null, lanes: filled() };
        }
        // The background asks again on every open, so a snapshot on file is always worth a refresh.
        if (pullsFilled) return { ...head, stale: true, fetchedAt: pullsFetchedAt, fetchedAgo: '2m', error: null, lanes: filled() };
        return { ...head, stale: true, fetchedAt: null, fetchedAgo: '', error: null, lanes: bare };
      }

      // The news, as the background would answer it. ?news=off starts with the switch off — no column,
      // no subscribe rows — ?news=empty is the feature on with nothing subscribed yet (→ on a repository
      // row shows the way in), ?news=fail has one repository the token cannot see, and ?news=cached
      // paints this morning's edition straight away instead of skeletons first.
      const newsMode = params.get('news') ?? 'on';
      const newsSettings = { enabled: newsMode === 'off' ? 0 : 1, hour: 8, days: 1 };
      let newsFilled = newsMode === 'cached';
      const clock = (hour) => `${String(hour).padStart(2, '0')}:00`;
      const newsRepos = newsMode === 'empty' ? [] : ['itk-dev/economics', 'os2display/display-api-service', 'Leantime/leantime'];
      // The window follows the span the settings page sets, as the background's would; the hour is
      // shown in the label only, since the fixed edition is pinned to the fixture's morning.
      const NEWS_UNTIL = Date.parse('2026-09-17T06:00:00.000Z');
      const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      function newsWindow() {
        const since = NEWS_UNTIL - newsSettings.days * 24 * 60 * 60 * 1000;
        const at = new Date(since);
        const time = clock(newsSettings.hour);
        const sinceLabel =
          newsSettings.days === 1 ? `since yesterday ${time}` : newsSettings.days < 7 ? `since ${WEEKDAYS[at.getDay()]} ${time}` : `since ${at.getDate()} Sep ${time}`;
        return { since: at.toISOString(), until: new Date(NEWS_UNTIL).toISOString(), sinceLabel };
      }
      // Prose as the background writes it: plain text and chips, each chip carrying what its
      // popover lists and what Enter opens.
      const seg = (text) => ({ text });
      const fact = (text, kind, url, items, more = false) => ({ text, chip: { kind, url, items, more } });
      const line = (title, detail, url) => ({ title, detail, url });
      const eco = 'https://github.com/itk-dev/economics';
      const lean = 'https://github.com/Leantime/leantime';
      // Every commit of the day, so the popover has something to scroll.
      const MESSAGES = [
        'Round VAT lines the way the bank does',
        'Quarterly export, with the long title that has to be cut off somewhere sensible',
        'Invoice numbering',
        'Import from the bank export',
        'Release 3.1.0',
      ];
      const commitLines = Array.from({ length: 23 }, (_, i) =>
        line(`${MESSAGES[i % MESSAGES.length]}${i >= MESSAGES.length ? ` (${i + 1})` : ''}`, `${(0xa1b2c3d + i * 0x11111).toString(16)} · ${['tuj', 'jekuno', 'marcel'][i % 3]}`, `${eco}/commit/${i}`),
      );
      const NEWS = {
        'itk-dev/economics': [
          seg('Released '),
          fact('v3.1.0', 'release', `${eco}/releases/tag/v3.1.0`, [line('v3.1.0 — Quarterly export', 'release', `${eco}/releases/tag/v3.1.0`)]),
          seg(' — Quarterly export. '),
          fact('23 commits', 'commits', `${eco}/commits/develop`, commitLines),
          seg(' to develop by tuj, jekuno and 2 more. '),
          fact('2 pull requests merged', 'pull', `${eco}/pulls?q=is%3Apr+is%3Amerged`, [
            line('Quarterly export, with the long title that has to be cut off somewhere sensible', '#88 · tuj', `${eco}/pull/88`),
            line('Invoice numbering', '#84 · jekuno', `${eco}/pull/84`),
          ]),
          seg(', '),
          fact('1 opened', 'pull', `${eco}/pulls?q=is%3Apr`, [line('Import from the bank export', '#79 · tuj', `${eco}/pull/79`)]),
          seg(' and '),
          fact('1 closed', 'pull', `${eco}/pulls?q=is%3Apr+is%3Aunmerged`, [line('Try the other rounding', '#77 · marcel', `${eco}/pull/77`)]),
          seg(' without merging. '),
          fact('2 issues opened', 'issue', `${eco}/issues`, [
            line('Rounding wrong in VAT lines', '#90 · anna', `${eco}/issues/90`),
            line('Export chokes on empty projects', '#89 · tuj', `${eco}/issues/89`),
          ]),
          seg(' and '),
          fact('1 closed', 'issue', `${eco}/issues?q=is%3Aclosed`, [line('Totals off by one øre', '#71 · anna', `${eco}/issues/71`)]),
          seg('.'),
        ],
        'os2display/display-api-service': [],
        'leantime/leantime': [
          fact('4 commits', 'commits', `${lean}/commits/master`, Array.from({ length: 4 }, (_, i) => line(['Docker healthcheck', 'Bump base image', 'Fix the healthcheck path', 'Changelog'][i], `f00ba1${i} · marcel`, `${lean}/commit/f00ba1${i}`))),
          seg(' to master by marcel. '),
          fact('1 pull request merged', 'pull', `${lean}/pulls`, [line('Docker healthcheck', '#2201 · marcel', `${lean}/pull/2201`)]),
          seg('.'),
        ],
      };
      function newsAnswer(message, filled) {
        const repos = newsRepos.map((repo) => {
          const prose = NEWS[repo.toLowerCase()] ?? [
            fact('2 commits', 'commits', `https://github.com/${repo}/commits/main`, [line('Tidy up', '0a1b2c3 · someone', `https://github.com/${repo}/commit/0a1b2c3`), line('Tidy up more', '1b2c3d4 · someone', `https://github.com/${repo}/commit/1b2c3d4`)]),
            seg(' to main by someone.'),
          ];
          const failed = newsMode === 'fail' && repo === 'os2display/display-api-service';
          if (!filled) return { repo, url: `https://github.com/${repo}`, private: false, prose: null, quiet: false, error: null };
          if (failed) return { repo, url: `https://github.com/${repo}`, private: true, prose: [], quiet: false, error: 'Not found, or the token cannot see it.' };
          return { repo, url: `https://github.com/${repo}`, private: repo.startsWith('itk-dev'), prose, quiet: prose.length === 0, error: null };
        });
        return {
          ok: true,
          show: newsSettings.enabled === 1,
          settings: { ...newsSettings, repos: newsRepos.slice() },
          stale: !filled,
          ...newsWindow(),
          fetchedAt: filled ? '2026-09-17T06:00:04.000Z' : null,
          repos,
        };
      }

      // The year's contributions, as the background would answer them. ?contributions=off starts with
      // the switch off, ?contributions=none with no snapshot yet — a shimmer, then the number —
      // ?contributions=fail with no snapshot and a token that cannot count, and ?contributions=cached
      // with a fresh snapshot that needs no refresh. Otherwise the snapshot is a little behind, so the
      // refresh that follows rolls the last digits on — the case worth watching.
      const contribMode = params.get('contributions') ?? 'on';
      const contribSettings = { enabled: contribMode === 'off' ? 0 : 1 };
      let contribTotal = contribMode === 'none' || contribMode === 'fail' ? null : contribMode === 'cached' ? 1234 : 1226;
      let contribFetchedAt = contribTotal === null ? null : '2026-09-17T07:10:00.000Z';
      let contribFresh = contribMode === 'cached';
      function contributionsAnswer(message) {
        const hasToken = sync.tokens.length > 0;
        const head = { ok: true, settings: { ...contribSettings }, hasToken, show: hasToken && contribSettings.enabled === 1, year: 2026, partial: null };
        if (message.type === 'gitchop:contributions:refresh') {
          if (contribMode === 'fail') {
            return { ...head, stale: true, total: contribTotal, past: [], login: null, fetchedAt: contribFetchedAt, fetchedAgo: '', error: 'The token cannot read your contributions. A classic token with repo can; a fine-grained one counts only what it is allowed to see.' };
          }
          contribTotal = 1234;
          contribFetchedAt = now();
          contribFresh = true;
        }
        const known = contribTotal !== null;
        return {
          ...head,
          stale: !contribFresh,
          total: contribTotal,
          // The three whole years before, for the hover; an account made this year would have none.
          past: known ? [{ year: 2025, total: 1802 }, { year: 2024, total: 1540 }, { year: 2023, total: 903 }] : [],
          login: known ? 'jeppekrogh' : null,
          fetchedAt: contribFetchedAt,
          fetchedAgo: known ? (contribFresh ? 'now' : '2h') : '',
          error: null,
        };
      }

      // The settings page is the real options.html in a frame, fetched and handed two things before
      // its own scripts run: a <base>, so its relative paths still resolve from here, and the
      // harness's browser object, so it shares one store and one background with the menu — a slider
      // moved there shapes the next chop here, a token removed there takes the pull requests out of
      // the menu. Its ES modules will not load from file://, which is what `node dev/serve.mjs` is
      // for — the server also makes the stage its Preview plays; ?settings opens it on load. Once
      // made, the frame is hidden rather than torn down, so the listeners it registered stay valid.
      const SERVED = location.protocol === 'http:' || location.protocol === 'https:';
      let manifest = { name: 'gitchop for GitHub', version: 'harness' };
      let frame = null;
      const toggle = document.getElementById('settings-toggle');
      function showSettings(show) {
        if (frame) frame.hidden = !show;
        toggle.textContent = show ? 'back to the page' : 'settings';
        document.getElementById('state').textContent = show ? 'settings' : 'ready';
      }
      async function openSettings() {
        if (!SERVED) {
          document.getElementById('state').textContent = 'settings need http: node dev/serve.mjs';
          return;
        }
        if (!frame) {
          const page = new URL('../src/options/options.html', location.href);
          const [html, found] = await Promise.all([
            fetch(page).then((response) => response.text()),
            fetch(new URL('../manifest.json', location.href)).then((response) => response.json()).catch(() => null),
          ]);
          if (found) manifest = found;
          frame = document.createElement('iframe');
          frame.id = 'settings';
          frame.title = 'gitchop settings';
          frame.srcdoc = html.replace(/<head>/i, `<head><base href="${page.href}"><script>window.browser = window.chrome = parent.browser;<\/script>`);
          document.body.append(frame);
        }
        showSettings(true);
      }
      toggle.addEventListener('click', () => {
        if (frame && !frame.hidden) showSettings(false);
        else openSettings();
      });

      const storageListeners = [];
      const notify = (changes, area) => {
        for (const listener of storageListeners) listener(changes, area);
      };

      // What GitHub says is left of each budget, as the background would have read it off the
      // last answers: an hour's graphql and rest, a minute's search, ticking down as the menu asks
      // — the pull requests on open, every search typed — the way the real table does when the
      // background writes it. Without a token there are only the nameless budgets, which GitHub
      // allows far less of.
      const rateLeft = { graphql: 4912, core: 4988, search: 29, anonCore: 57, anonSearch: 9 };
      const rateTurns = { graphql: Date.now() + 41 * 60000, core: Date.now() + 12 * 60000, search: Date.now() + 38000 };
      function rateAnswer() {
        const budget = (id, label, remaining, limit) => ({ id, label, remaining, limit, resetAt: rateTurns[id] });
        if (sync.tokens.length > 0) {
          const resources = [budget('graphql', 'graphql', rateLeft.graphql, 5000), budget('core', 'rest', rateLeft.core, 5000), budget('search', 'search', rateLeft.search, 30)];
          return { ok: true, scopes: [{ id: 'jeppekrogh', label: 'jeppekrogh', resources }] };
        }
        const resources = [budget('core', 'rest', rateLeft.anonCore, 60), budget('search', 'search', rateLeft.anonSearch, 10)];
        return { ok: true, scopes: [{ id: 'anonymous', label: 'no token', resources }] };
      }
      function rateTick(id, points = 1) {
        // A minute's allowance that has turned starts over, as GitHub's does.
        if (id === 'search' && rateTurns.search < Date.now()) {
          rateTurns.search = Date.now() + 60000;
          rateLeft.search = 30;
          rateLeft.anonSearch = 10;
        }
        const key = sync.tokens.length > 0 ? id : id === 'core' ? 'anonCore' : id === 'search' ? 'anonSearch' : null;
        if (!key || !(key in rateLeft)) return;
        rateLeft[key] = Math.max(0, rateLeft[key] - points);
        notify({ rateCache: { newValue: { ...rateLeft } } }, 'local');
      }
      let welcomed = false;
      let consented = false;
      window.browser = window.chrome = {
        runtime: {
          lastError: undefined,
          getManifest: () => manifest,
          async sendMessage(message) {
            document.getElementById('state').textContent = `msg: ${message.type}`;
            if (message.type === 'gitchop:options') {
              openSettings();
              return { ok: true };
            }
            // ?welcome=first: a profile that has not been welcomed, so the first press shows the welcome.
            if (message.type === 'gitchop:welcome') return { ok: true, first: params.get('welcome') === 'first' && sync.tokens.length === 0 && !welcomed, hint: sync.tokens.length === 0 && !store.hintDismissed };
            // The page opened at the browser's question: here it answers yes at once, so the
            // overlay finds access granted when the harness tab is shown again.
            if (message.type === 'gitchop:welcome:open') {
              if (message.at === 'consent') consented = true;
              return { ok: true };
            }
            if (message.type === 'gitchop:welcome:done') {
              welcomed = true;
              notify({ welcomed: { newValue: true } }, 'local');
              return { ok: true };
            }
            // ?access=elsewhere: a Firefox without the consent to hold a token yet.
            if (message.type === 'gitchop:signin:access') return { ok: true, granted: params.get('access') !== 'elsewhere' || consented };
            // The device flow, never reaching GitHub: a code that stays pending until it runs out.
            if (message.type === 'gitchop:signin:pending') return { ok: true, code: null };
            if (message.type === 'gitchop:signin:start') return { ok: true, userCode: 'WDJB-MJHT', verificationUri: 'https://github.com/login/device', expiresAt: new Date(Date.now() + 900000).toISOString(), interval: 5 };
            if (message.type === 'gitchop:signin:poll') return { ok: true, status: 'pending', interval: 5, error: null, state: null };
            if (message.type === 'gitchop:welcome:hint:dismiss') {
              store.hintDismissed = true;
              return { ok: true };
            }
            if (message.type === 'gitchop:panel') return { ok: true, settings: { ...store.panel }, show: store.panel.enabled === 1 };
            if (message.type === 'gitchop:panel:settings') {
              Object.assign(store.panel, message.patch);
              return { ok: true, settings: { ...store.panel }, show: store.panel.enabled === 1 };
            }
            if (message.type === 'gitchop:rate') return rateAnswer();
            if (message.type === 'gitchop:pulls') return pullsAnswer(message);
            if (message.type === 'gitchop:pulls:refresh') {
              await wait(900);
              rateTick('graphql', 17);
              return pullsAnswer(message);
            }
            if (message.type === 'gitchop:pulls:settings') {
              Object.assign(pullsSettings, message.patch);
              return pullsAnswer({ type: 'gitchop:pulls' });
            }
            if (message.type === 'gitchop:news') return newsAnswer(message, newsFilled);
            if (message.type === 'gitchop:news:refresh') {
              await wait(900);
              rateTick('core', 5 * newsRepos.length);
              newsFilled = true;
              return newsAnswer(message, true);
            }
            if (message.type === 'gitchop:news:settings') {
              Object.assign(newsSettings, message.patch);
              return newsAnswer(message, newsFilled);
            }
            if (message.type === 'gitchop:contributions') return contributionsAnswer(message);
            if (message.type === 'gitchop:contributions:refresh') {
              await wait(900);
              rateTick('graphql', 1);
              return contributionsAnswer(message);
            }
            if (message.type === 'gitchop:contributions:settings') {
              Object.assign(contribSettings, message.patch);
              return contributionsAnswer({ type: 'gitchop:contributions' });
            }
            if (message.type === 'gitchop:news:subscribe' || message.type === 'gitchop:news:unsubscribe') {
              const subscribe = message.type.endsWith(':subscribe');
              const at = newsRepos.findIndex((repo) => repo.toLowerCase() === message.repo.toLowerCase());
              if (subscribe && at < 0) newsRepos.push(message.repo);
              if (!subscribe && at >= 0) newsRepos.splice(at, 1);
              // A repository just subscribed has no prose yet; everything else keeps this morning's.
              newsFilled = true;
              const answer = newsAnswer(message, true);
              if (subscribe) {
                const fresh = answer.repos.find((entry) => entry.repo === message.repo);
                if (fresh) Object.assign(fresh, { prose: null, quiet: false });
                answer.stale = true;
              }
              return answer;
            }
            const settled = await settingsAnswer(message);
            if (settled) return settled;
            if (message.type !== 'gitchop:repos') return { ok: true };
            await new Promise((done) => setTimeout(done, 260));
            rateTick('search');
            if (params.get('search') === 'fail') return { ok: false, error: 'GitHub rate-limited the search.' };
            const term = message.query.split('/').pop();
            return {
              ok: true,
              owners: ['itk-dev', 'os2display'],
              results: [
                { fullName: `itk-dev/${term}`, url: 'https://github.com/itk-dev', description: 'the one you almost certainly meant', private: true, archived: false, owned: true },
                { fullName: `os2display/${term}-admin`, url: 'https://github.com/os2display', description: '', private: false, archived: false, owned: true },
                { fullName: `Leantime/${term}`, url: 'https://github.com/Leantime/leantime', description: 'open source project management', private: false, archived: false, owned: false },
                { fullName: `someone/${term}-old`, url: 'https://github.com/someone', description: 'no longer maintained', private: false, archived: true, owned: false },
                // Enough rows beyond these to fill the ten slots, so the list's scroll has something to do.
                { fullName: `itk-dev/${term}-api`, url: 'https://github.com/itk-dev', description: '', private: true, archived: false, owned: true },
                { fullName: `os2display/${term}-client`, url: 'https://github.com/os2display', description: '', private: false, archived: false, owned: true },
                { fullName: `acme/${term}`, url: 'https://github.com/acme', description: 'a fork', private: false, archived: false, owned: false },
                { fullName: `acme/${term}-docs`, url: 'https://github.com/acme', description: '', private: false, archived: false, owned: false },
                { fullName: `example/${term}-playground`, url: 'https://github.com/example', description: '', private: false, archived: false, owned: false },
                { fullName: `example/${term}-2`, url: 'https://github.com/example', description: '', private: false, archived: true, owned: false },
              ],
            };
          },
        },
        storage: {
          local: {
            get: async () => (welcomed ? { welcomed: true } : {}),
          },
          sync: {
            get: async () => JSON.parse(JSON.stringify(store)),
            // Notifies like the real API, so the content script's effects cache follows the settings page.
            set: async (patch) => {
              const changes = {};
              for (const [key, value] of Object.entries(patch)) {
                changes[key] = { oldValue: store[key], newValue: value };
              }
              Object.assign(store, patch);
              notify(changes, 'sync');
              // A saved link leaves the backup with changes pending, and the background pushes them a
              // beat later; the token card follows the local `sync` record through both.
              if ('links' in patch && sync.gistId) {
                sync.dirty = true;
                notify({ sync: {} }, 'local');
                setTimeout(() => {
                  Object.assign(sync, { dirty: false, lastPushedAt: now() });
                  notify({ sync: {} }, 'local');
                }, 1500);
              }
            },
          },
          onChanged: { addListener: (listener) => storageListeners.push(listener) },
        },
        // ?access=denied shows the card Firefox users see before granting github.com; granting it here
        // simply succeeds. Consent for data collection, which the token card asks for, is always given.
        permissions: {
          contains: async (wanted) => !wanted.origins || access,
          request: async () => {
            access = true;
            return true;
          },
          onAdded: { addListener() {} },
          onRemoved: { addListener() {} },
        },
      };
      let access = params.get('access') !== 'denied';

      for (const key of Object.keys(store.effects)) {
        if (params.has(key)) store.effects[key] = Number(params.get(key));
      }

      document.getElementById('chop').addEventListener('click', () => {
        dispatchEvent(new KeyboardEvent('keydown', { key: '.', bubbles: true }));
      });

      if (params.has('settings')) openSettings();
    </script>
    <!--
      The content script as a package carries it: one bundle. dev/serve.mjs makes it from
      src/content on every request; from file:// it is the git-ignored copy that `node dev/bundle.mjs`
      and every build write next to this page, so a still taken that way runs the last build.
    -->
    <script src="content.js" onerror="document.getElementById('state').textContent = 'no menu yet: node dev/bundle.mjs, or node dev/serve.mjs'"></script>
    <script>
      // harness.html?autochop&colour=210&epicness=90 chops on load, so a reload replays the effect.
      if (params.has('autochop')) document.getElementById('chop').click();
    </script>
  </body>
</html>
