name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # esbuild, for the bundles, TypeScript, for the type check, and ESLint; package-lock.json pins them.
      # ESLint 10 wants node 22.13 or later, which the 22 line above resolves to.
      - name: Install the build's tools
        run: npm ci

      - name: Lint
        run: npm run lint

      # Nothing is compiled: tsc reads the JSDoc in the sources, so this is where a message the
      # background has no handler for, or one missing a field its handler reads, is caught.
      - name: Type check
        run: npm run typecheck

      # Every dev/*.test.mjs, under node's test runner; a new test file is picked up without a line here.
      - name: Tests
        run: npm test

      # The background reaches the browser unbundled, so this is where a mistyped path or a broken
      # import is caught — the build refuses to package a manifest it cannot resolve, or a bundle
      # esbuild cannot make.
      - name: Package for every browser
        run: node dev/build.mjs all

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.xpi
            dist/*.zip
          if-no-files-found: error
