name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # esbuild, for the bundles, and TypeScript, for the type check; package-lock.json pins them.
      - name: Install the build's tools
        run: npm ci

      # Nothing is compiled: tsc reads the JSDoc in the sources, so this is where a message the
      # background has no handler for, or one missing a field its handler reads, is caught.
      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: |
          node dev/context.test.mjs
          node dev/repos.test.mjs
          node dev/effects.test.mjs
          node dev/pulls.test.mjs
          node dev/news.test.mjs
          node dev/contributions.test.mjs
          node dev/odometer.test.mjs
          node dev/links.test.mjs
          node dev/gist.test.mjs
          node dev/rate.test.mjs
          node dev/menu.test.mjs
          node dev/background.test.mjs

      # The background reaches the browser unbundled, so this is where a mistyped path or a broken
      # import is caught — the build refuses to package a manifest it cannot resolve, or a bundle
      # esbuild cannot make.
      - name: Package for every browser
        run: node dev/build.mjs all

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.xpi
            dist/*.zip
          if-no-files-found: error
