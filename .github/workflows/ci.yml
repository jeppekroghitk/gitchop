name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: |
          node dev/context.test.mjs
          node dev/repos.test.mjs
          node dev/effects.test.mjs
          node dev/pulls.test.mjs
          node dev/news.test.mjs
          node dev/contributions.test.mjs
          node dev/odometer.test.mjs
          node dev/links.test.mjs

      # There is no bundler between src/ and the browser, so this is where a mistyped path or a
      # broken import is caught — the build refuses to package a manifest it cannot resolve.
      - name: Package for every browser
        run: node dev/build.mjs all

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.xpi
            dist/*.zip
          if-no-files-found: error
